version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    reviewers:
      - nimdanitro
    schedule:
      interval: "daily"
      time: "20:00"
    open-pull-requests-limit: 10
    # wait a few days after a release before proposing it (security updates are not delayed)
    cooldown:
      default-days: 3
    groups:
      development-dependencies:
        dependency-type: "development"
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
    labels:
      - "javascript"
      - "dependencies"

  # Enable version updates for Github Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 3
    reviewers:
      - nimdanitro
    schedule:
      interval: "daily"
      time: "20:00"
    labels:
      - "gh-actions"
      - "dependencies"
